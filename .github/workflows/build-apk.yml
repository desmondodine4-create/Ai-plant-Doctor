name: Build AI Plant Doctor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release/AIPlantDoctor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIPlantDoctor-APK
          path: release/AIPlantDoctor.apk
          retention-days: 30
