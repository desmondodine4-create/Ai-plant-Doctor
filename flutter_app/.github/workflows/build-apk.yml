name: Build AI Plant Doctor Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies and generate icons
        working-directory: flutter_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build release APK
        working-directory: flutter_app
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=https://ais-pre-oivaenuekrn2ubfchhemzv-49352884450.europe-west3.run.app
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIPlantDoctor.apk

      - name: Upload AIPlantDoctor.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPlantDoctor-apk
          path: flutter_app/build/app/outputs/flutter-apk/AIPlantDoctor.apk
