name: Build AI Plant Doctor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify toolchain versions
        run: |
          java -version
          flutter --version

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://ais-pre-oivaenuekrn2ubfchhemzv-49352884450.europe-west3.run.app

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release/AIPlantDoctor.apk
          ls -lh release/AIPlantDoctor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPlantDoctor-APK
          path: release/AIPlantDoctor.apk
          retention-days: 30
