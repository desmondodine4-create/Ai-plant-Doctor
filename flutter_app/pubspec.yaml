name: ai_plant_doctor
description: "AI Plant Doctor - Your Intelligent Plant Health Assistant powered by Gemini AI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.jpg"
  adaptive_icon_background: "#14532D"
  adaptive_icon_foreground: "assets/images/app_icon.jpg"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/images/
